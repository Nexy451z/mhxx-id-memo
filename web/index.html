<title>MHXX ID MEMO — Monster Hunter XX データ ID ビューア</title>
<script>
/* テーマを最初に確定させる（ちらつき防止）。既定はライト。 */

    var t = localStorage.getItem('mhxx-theme');

  } catch (e) { /* localStorage 不可でも続行 */ }

<style>
:root{
  --bg:#ffffff; --bg2:#f7f8fa; --bg3:#eef1f5; --bg4:#e2e7ee;
  --line:#dde3ea; --line2:#c6d0da;
  --fg:#1b2430; --fg2:#4b5a6a; --fg3:#78889a;
  --accent:#0b6bcb; --accent-bg:#e5f0fb; --accent-fg:#0a4f95;
  --ok:#18794e; --ok-bg:#e6f5ec;
  --warn:#8a6100; --warn-bg:#fdf4e0;
  --err:#c0392b; --err-bg:#fdecea;
  --row-hover:#f2f6fa; --row-sel:#dcecfb;
  --shadow:0 10px 30px rgba(16,32,48,.12);
  --mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif;
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#0e1116; --bg2:#141920; --bg3:#1b222b; --bg4:#232c37;
  --line:#2a333e; --line2:#3a4753;
  --fg:#e2e8ef; --fg2:#a7b4c2; --fg3:#6d7c8b;
  --accent:#4ea1e8; --accent-bg:#12324d; --accent-fg:#bcdcf7;
  --ok:#4ec98a; --ok-bg:#12241b;
  --warn:#e8b95c; --warn-bg:#241d10;
  --err:#e86a6a; --err-bg:#2a1616;
  --row-hover:#171e26; --row-sel:#152b3d;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  color-scheme: dark;
}
*{box-sizing:border-box}
/* hidden 属性は必ず効かせる（display:flex 等の指定に負けないように） */
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ---------------- sidebar ---------------- */
#sidebar{width:252px;flex:0 0 252px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:40}
.sb-head{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.sb-title{font-weight:700;font-size:14px;letter-spacing:.02em}
.sb-sub{color:var(--fg3);font-size:11px;margin-top:2px}
.sb-list{overflow-y:auto;flex:1;padding:4px 0 10px}
.grp{padding:10px 13px 4px;color:var(--fg3);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-family:var(--mono)}
.titem{display:flex;gap:8px;align-items:baseline;padding:5px 13px;cursor:pointer;border-left:2px solid transparent;user-select:none}
.titem:hover{background:var(--bg3)}
.titem.active{background:var(--bg3);border-left-color:var(--accent)}
.titem.active .nm{color:var(--fg);font-weight:700}
.titem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .ct{color:var(--fg3);font:10.5px var(--mono);flex:0 0 auto}
.titem.active .ct{color:var(--fg2)}
.sb-foot{padding:8px 13px;border-top:1px solid var(--line);color:var(--fg3);font:10.5px/1.5 var(--mono);word-break:break-all}
/* サイドバーのスケルトン（index.js 読込前） */
.skel{padding:5px 13px}
.skel i{display:block;height:9px;border-radius:4px;background:var(--bg4);opacity:.75}
.skel.g{padding-top:12px}
.skel.g i{height:7px;width:45%}

/* ---------------- main ---------------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg2);min-height:46px}
#btn-menu{display:none}
#tbl-title{min-width:0;flex:1;overflow:hidden}
#tbl-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:100%;vertical-align:bottom}
#tbl-id{color:var(--fg3);font-size:11px;margin-left:8px}
#counts{display:flex;gap:12px;font:11.5px var(--mono);color:var(--fg2);flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
#counts b{color:var(--fg);font-weight:700}
#counts .sel b{color:var(--accent)}
#counts .view b{color:var(--ok)}
#btn-theme{flex:0 0 auto;font-size:15px;line-height:1;padding:5px 9px}

#toolbar{padding:7px 12px 8px;border-bottom:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.tb-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 240px;min-width:140px}
input[type=search],input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;outline:none;min-width:0;color:var(--fg)}
input[type=search]:focus,input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input::placeholder{color:var(--fg3)}
#fcol{flex:0 0 auto;max-width:180px}
#fval{flex:0 1 180px}
.btn{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--bg3);border-color:var(--fg3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.sep{width:1px;height:20px;background:var(--line2);margin:0 2px}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;min-width:230px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:5px;z-index:60;box-shadow:var(--shadow);max-height:70vh;overflow:auto}
.menu .mi{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--accent-bg)}
.menu .msep{height:1px;background:var(--line);margin:5px 3px}
.menu .mhead{padding:5px 9px 3px;color:var(--fg3);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.menu label.mi{display:flex;gap:8px;align-items:center;cursor:pointer}
.menu label.mi input{accent-color:var(--accent)}

/* ---------------- grid ---------------- */
#gridwrap{flex:1;overflow:auto;min-height:0;background:var(--bg);position:relative}
#grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
#grid thead th{position:sticky;top:0;z-index:2;background:var(--bg3);border-bottom:1px solid var(--line2);border-right:1px solid var(--line);padding:5px 9px;text-align:left;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;vertical-align:bottom}
#grid thead th:hover{background:var(--bg4)}
#grid thead th.no-sort{cursor:default}
#grid thead th.no-sort:hover{background:var(--bg3)}
#grid thead th .hn{display:block;font:11px var(--mono);color:var(--fg2)}
#grid thead th .hd{display:block;font-size:10.5px;color:var(--fg3);font-weight:400;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#grid thead th.asc .hn::after{content:" ▲";color:var(--accent)}
#grid thead th.desc .hn::after{content:" ▼";color:var(--accent)}
#grid tbody td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 9px;white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
#grid tbody tr:hover td{background:var(--row-hover)}
#grid tbody tr.sel td{background:var(--row-sel)}
#grid tbody tr{cursor:pointer}
#grid td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#grid td.c-sel,#grid th.c-sel{width:30px;text-align:center;padding-left:0;padding-right:0}
#grid td.c-num,#grid th.c-num{width:56px;text-align:right;color:var(--fg3);font:11px var(--mono);padding-right:9px}
/* チェックボックスは自前描画（ブラウザ/テーマ差で黒四角にならないように） */
input[type=checkbox]{
  -webkit-appearance:none;appearance:none;
  width:15px;height:15px;flex:0 0 auto;
  border:1.5px solid var(--line2);border-radius:4px;background:var(--bg);
  cursor:pointer;margin:0;position:relative;vertical-align:middle;
  transition:background .12s,border-color .12s;
}
input[type=checkbox]:hover{border-color:var(--accent)}
input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{
  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
input[type=checkbox]:indeterminate::after{
  content:"";position:absolute;left:3px;top:6px;width:7px;height:2px;background:#fff;border-radius:1px;
}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#grid th.c-sel input{margin-top:2px}

/* ---------------- state (loading / error) ---------------- */
.state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 20px;text-align:center;background:var(--bg)}
.state[hidden]{display:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-msg{color:var(--fg2);font-size:13.5px}
.state-sub{color:var(--fg3);font-size:12px}
.state.error{background:var(--bg2)}
.state.error .box{max-width:620px;width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:26px 24px;box-shadow:var(--shadow);text-align:left}
.state.error h2{margin:0 0 10px;font-size:17px;color:var(--err)}
.state.error p{margin:0 0 10px;color:var(--fg2);font-size:13px;line-height:1.75}
.state.error ul{margin:0 0 14px;padding-left:20px;color:var(--fg2);font-size:12.5px;line-height:1.9}
.state.error code{background:var(--bg3);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;word-break:break-all}
.state.error .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.bigbtn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn.ghost{background:var(--bg);color:var(--accent-fg);border-color:var(--line2);font-weight:600}
.state.error .hint{font-size:11.5px;color:var(--fg3);margin-top:12px;word-break:break-all}

/* ---------------- pager ---------------- */
#pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-top:1px solid var(--line);background:var(--bg2);font:11.5px var(--mono);color:var(--fg2);flex-wrap:wrap}
#pg-right{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
#pager .btn{padding:3px 8px;font-size:11.5px}
#pagein{width:60px;text-align:right;font-family:var(--mono)}
#psize{padding:3px 6px;font-size:11.5px}

/* ---------------- drawer / modal ---------------- */
#detail{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:70;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.dtitle{font-weight:700;font-size:14px}
.dsub{color:var(--fg3);font:11px var(--mono);margin-top:2px;word-break:break-all}
.dbody{overflow:auto;flex:1;padding:6px 0 16px}
.drow{padding:6px 13px;border-bottom:1px solid var(--line)}
.dlabel{display:flex;gap:8px;align-items:baseline;margin-bottom:2px;flex-wrap:wrap}
.dname{font:11px var(--mono);color:var(--fg2)}
.ddesc{font-size:10.5px;color:var(--fg3)}
.dval{display:flex;gap:8px;align-items:flex-start}
.dval code{flex:1;min-width:0;font:12px/1.5 var(--mono);color:var(--fg);white-space:pre-wrap;word-break:break-word}
.mini{background:var(--bg);border:1px solid var(--line2);border-radius:5px;padding:1px 7px;font-size:10.5px;cursor:pointer;color:var(--fg2);flex:0 0 auto}
.mini:hover{background:var(--bg3);color:var(--fg)}
.x{background:none;border:0;color:var(--fg3);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.x:hover{color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(16,24,32,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal[hidden]{display:none}
.modal-box{background:var(--bg);border:1px solid var(--line2);border-radius:10px;max-width:900px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.mhead .dtitle{flex:1}
.mbody{overflow:auto;padding:12px 14px 18px}
.mbody h4{margin:16px 0 6px;font-size:12px;color:var(--fg2);letter-spacing:.04em}
.mbody h4:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 12px;font-size:12px}
.kv dt{color:var(--fg3);font-family:var(--mono);font-size:11px}
.kv dd{margin:0;word-break:break-all}
.mbody table{width:100%;border-collapse:collapse;font-size:12px}
.mbody table th,.mbody table td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.mbody table th{background:var(--bg3);font-weight:600;font-size:11.5px}
.mbody table td.mono{font-family:var(--mono);font-size:11.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-family:var(--mono);border:1px solid}
.badge.verified{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.badge.derived{color:var(--accent-fg);border-color:var(--accent);background:var(--accent-bg)}
.badge.curated{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.srcs{margin:0;padding-left:18px;font-family:var(--mono);font-size:11.5px;color:var(--fg2)}
.srcs li{word-break:break-all}

/* ---------------- toast ---------------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;z-index:100;box-shadow:var(--shadow);font-size:12.5px;max-width:80vw}
.toast.err{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.toast[hidden]{display:none}

/* ---------------- mode switch ---------------- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{background:var(--bg);border:0;padding:6px 12px;cursor:pointer;color:var(--fg2);font-size:12.5px;white-space:nowrap;min-height:32px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.seg button:hover:not(.on){background:var(--bg3)}

/* ---------------- memory mode ---------------- */
#mem{flex:1;overflow:auto;min-height:0;background:var(--bg2);padding:14px}
#mem[hidden]{display:none}
.mem-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mem-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.mem-card h3{margin:0 0 10px;font-size:13px;color:var(--fg);display:flex;align-items:center;gap:8px}
.mem-card h3 .num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;flex:0 0 auto}
.mem-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mem-row label{color:var(--fg2);font-size:12px;white-space:nowrap}
.mem-row select,.mem-row input{min-width:0}
.mem-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg)}
.mem-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--fg);font-size:12.5px;min-height:40px}
.mem-item:last-child{border-bottom:0}
.mem-item:hover{background:var(--bg3)}
.mem-item.on{background:var(--accent-bg);font-weight:700}
.mem-item .id{font:11px var(--mono);color:var(--fg3);flex:0 0 auto}
.mem-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-item .sub{font:10.5px var(--mono);color:var(--fg3);flex:0 0 auto}
.mem-empty{padding:16px;color:var(--fg3);font-size:12px;text-align:center}
.mem-note{color:var(--fg3);font-size:11.5px;line-height:1.7}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mem-box{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mem-box .k{font-size:11px;color:var(--fg3);margin-bottom:4px}
.mem-box .v{font:13px var(--mono);color:var(--fg);word-break:break-all}
.mem-box input{width:100%;margin-top:4px}
.mem-copybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;padding:10px 12px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:8px}
.mem-copybar .btn.primary{min-height:44px;font-size:14px;font-weight:700}
.mem-copybar .mem-note{color:var(--accent-fg);font-size:11.5px;flex:1;min-width:150px}
.mem-help{font-size:12px;color:var(--fg2);line-height:1.95}
.mem-help ol{margin:6px 0 0;padding-left:20px}
.mem-help code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px}

/* hex dump */
.hex{display:flex;flex-wrap:wrap;gap:3px;font:13px/1.9 var(--mono);margin:4px 0 10px}
.hex span{padding:1px 5px;border-radius:3px;border:1px solid transparent}
.hex .f0{background:#dbeafe;color:#123a63}
.hex .f1{background:#dcfce7;color:#14532d}
.hex .f2{background:#fef3c7;color:#5b4300}
.hex .f3{background:#fae8ff;color:#5b1a6b}
.hex .f4{background:#fee2e2;color:#6b1a1a}
.hex .f5{background:#e0e7ff;color:#2b2f6b}
.hex .f6{background:#e8eaed;color:#3c4043}
html[data-theme="dark"] .hex .f0{background:#12324d;color:#bcdcf7}
html[data-theme="dark"] .hex .f1{background:#123222;color:#a7f3c9}
html[data-theme="dark"] .hex .f2{background:#33280d;color:#f3d99b}
html[data-theme="dark"] .hex .f3{background:#2e1638;color:#e9c8f5}
html[data-theme="dark"] .hex .f4{background:#3a1a1a;color:#f5c2c2}
html[data-theme="dark"] .hex .f5{background:#1e2350;color:#c7cdf7}
html[data-theme="dark"] .hex .f6{background:#262c34;color:#b6c0cb}
.hex-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fg2);margin-top:4px}
.hex-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pat{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pat .lbl{font:11px var(--mono);color:var(--fg3);flex:0 0 120px;line-height:1.35}
.pat code{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:12px var(--mono);word-break:break-all}
.annot{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px;margin-top:6px}

  #sidebar{width:208px;flex-basis:208px}

  #sidebar{position:fixed;top:0;left:0;bottom:0;width:264px;flex-basis:264px;transform:translateX(-100%);transition:transform .16s ease;box-shadow:var(--shadow)}

}
@media (max-width: 700px){

  <aside id="sidebar">

<script src="data/index.js" id="mhxx-index"></script>
<script>
(function () {
'use strict';

/* ============================================================ 基本 */
var IDX = window.MHXX_ID_MEMO_INDEX || null;
var TABLES = (IDX && IDX.tables) || [];
var META = (IDX && IDX.meta) || {};
var IS_SINGLE = /mhxx-id-memo\.html$/i.test(location.pathname);
var T0 = (window.performance && performance.now) ? performance.now() : Date.now();

window.__MHXX_TIMING = {
  indexAt: (typeof window.__MHXX_INDEX_AT === 'number') ? window.__MHXX_INDEX_AT : T0,
  bootAt: 0,
  firstRowsAt: 0
};

function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) { n.className = cls; }
  if (txt != null) { n.textContent = txt; }
  return n;
}
function esc(s) {
  s = (s == null) ? '' : String(s);
  return s.replace(/[&<>"']/g, function (c) {
    if (c === '&') { return '&amp;'; }
    if (c === '<') { return '&lt;'; }
    if (c === '>') { return '&gt;'; }
    if (c === '"') { return '&quot;'; }
    return '&#39;';
  });
}
function fmtNum(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
var COLL = null;
try { COLL = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' }); } catch (e) { COLL = null; }
function cmpStr(a, b) {
  if (COLL) { return COLL.compare(a, b); }
  return a < b ? -1 : (a > b ? 1 : 0);
}
function norm(s) {
  s = (s == null) ? '' : String(s);
  if (s.normalize) { try { s = s.normalize('NFKC'); } catch (e) { /* noop */ } }
  return s.toLowerCase();
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function stamp() {
  var d = new Date();
  return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' +
    pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
}
function isTyping(node) {
  if (!node || !node.tagName) { return false; }
  var t = node.tagName;
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || node.isContentEditable === true;
}

/* ============================================================ 計測（GA4 直接）
   方針:
   - 失敗してもアプリの挙動に影響させない（try/catch で握りつぶす）
   - 検索文字列・行の中身は送らない。件数・ID・種別だけ送る
   - イベント名は mhxx_ 接頭辞 + snake_case（40 文字以内）
   - gtag.js は head で同期定義済み（未ロード時は dataLayer にキューされる） */
var __gaQueue = [];
var __gaTimer = null;
/* gtag.js は script の onload 後もしばらく初期化が続く。
   google_tag_manager に測定 ID が現れてから送らないと、初期イベントが
   黙って捨てられる（実測で確認）。 */
function __gaReady() {
  try {
    return !!(window.google_tag_manager && window.google_tag_manager['G-QPCD4BGBL8']);
  } catch (e) { return false; }
}
function __gaFlush() {
  try {
    if (!__gaReady()) { return false; }
    while (__gaQueue.length) {
      var it = __gaQueue.shift();
      window.gtag('event', it[0], it[1]);
    }
    return true;
  } catch (e) { return false; }
}
window.__gtagFlush = __gaFlush;
function track(name, params) {
  try {
    var p = params || {};
    if (__gaReady() && typeof window.gtag === 'function') {
      window.gtag('event', name, p);
      return;
    }
    __gaQueue.push([name, p]);
    if (!__gaTimer) {
      var tries = 0;
      __gaTimer = setInterval(function () {
        tries++;
        if (__gaFlush() || tries > 100) { clearInterval(__gaTimer); __gaTimer = null; }
      }, 100);
    }
  } catch (e) { /* 計測失敗は無視 */ }
}

/* ============================================================ テーマ */
function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function setTheme(t) {
  if (t === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    t = 'light';
  }
  try { localStorage.setItem('mhxx-theme', t); } catch (e) { /* noop */ }
  var b = $('btn-theme');
  if (b) {
    b.textContent = (t === 'dark') ? '☀' : '🌙';
    b.title = (t === 'dark') ? 'ライトテーマに切り替え' : 'ダークテーマに切り替え';
    b.setAttribute('aria-label', b.title);
  }
}
function toggleTheme() {
  var next = (currentTheme() === 'dark') ? 'light' : 'dark';
  setTheme(next);
  track('mhxx_theme_change', { theme: next });
}

/* ============================================================ データ */
function store() {
  if (!window.MHXX_ID_MEMO_TABLES) { window.MHXX_ID_MEMO_TABLES = {}; }
  return window.MHXX_ID_MEMO_TABLES;
}
function rowsOf(id) {
  var s = window.MHXX_ID_MEMO_TABLES;
  if (!s) { return null; }
  var e = s[id];
  return (e && e.rows) ? e.rows : null;
}
var pending = {};
function ensureTable(id) {
  if (rowsOf(id)) { return Promise.resolve(); }
  if (pending[id]) { return pending[id]; }
  var p = new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'data/' + encodeURIComponent(id) + '.js';
    s.async = true;
    s.onload = function () {
      if (rowsOf(id)) { resolve(); } else { reject(new Error('データが空でした: ' + id)); }
    };
    s.onerror = function () {
      reject(new Error('ファイルを読み込めませんでした: data/' + id + '.js'));
    };
    document.head.appendChild(s);
  });
  pending[id] = p;
  return p;
}

/* ============================================================ 状態表示 */
function showState(html, isError) {
  var st = $('state');
  st.className = 'state' + (isError ? ' error' : '');
  st.innerHTML = html;
  st.hidden = false;
  $('grid').hidden = true;
  $('pager').hidden = true;
}
function showLoading(msg) {
  showState('<div class="spinner"></div><div class="state-msg">' + esc(msg) + '</div>', false);
}
function hideState() {
  $('state').hidden = true;
  $('grid').hidden = false;
  $('pager').hidden = (S.mode === 'mem');
}

function showFatal(title, bodyHtml) {
  var actions = '';
  if (!IS_SINGLE) {
    actions += '<a class="bigbtn" href="mhxx-id-memo.html">単一ファイル版を開く</a>';
  }
  actions += '<button class="bigbtn ghost" data-act="reload">再読み込み</button>';
  showState(
    '<div class="box">' +
      '<h2>' + esc(title) + '</h2>' +
      bodyHtml +
      '<div class="actions">' + actions + '</div>' +
      '<div class="hint">開いている URL: ' + esc(location.href) + '</div>' +
    '</div>',
    true
  );
}

function showIndexMissing() {
  showFatal('データを読み込めませんでした',
    '<p><b>data/index.js</b> が見つからないか、読み込みに失敗しました。' +
    'このビューアは <b>web/</b> フォルダごと配布する必要があります（index.html だけでは動きません）。</p>' +
    '<ul>' +
      '<li>配布物に <code>web/data/index.js</code> が含まれているか確認してください</li>' +
      '<li>ローカルで開く場合は <code>python tools/build.py</code> で再生成してください</li>' +
      '<li>1 ファイルで持ち歩きたい場合は、下の <b>単一ファイル版</b> をお使いください</li>' +
    '</ul>');
}

function showLoadError(t, err) {
  showFatal('「' + t.title_ja + '」を読み込めませんでした',
    '<p>テーブルデータ <code>data/' + esc(t.id) + '.js</code> を読み込めませんでした。</p>' +
    '<ul><li>' + esc(err && err.message ? err.message : String(err)) + '</li>' +
    '<li>配布物に <code>web/data/</code> フォルダが含まれているか確認してください</li></ul>');
}

/* ============================================================ state */
var S = {
  mode: 'list',
  tableId: null,
  q: '',
  fcol: '',
  fval: '',
  sortCol: -1,
  sortDir: 1,
  sel: new Set(),
  page: 0,
  pageSize: 200,
  hidden: {},
  view: [],
  detail: -1,
  onlyVisible: true,
  normCache: {}
};

function tableById(id) {
  for (var i = 0; i < TABLES.length; i++) {
    if (TABLES[i].id === id) { return TABLES[i]; }
  }
  return null;
}
function cur() { return S.tableId ? tableById(S.tableId) : null; }
function curRows() { return S.tableId ? rowsOf(S.tableId) : null; }
function colIndex(t, name) {
  for (var i = 0; i < t.columns.length; i++) {
    if (t.columns[i].name === name) { return i; }
  }
  return -1;
}
function isNumCol(t, i) {
  var c = t.columns[i];
  return !!c && (c.type === 'int' || c.type === 'float');
}
function visibleCols(t) {
  var out = [];
  for (var i = 0; i < t.columns.length; i++) {
    if (!S.hidden[t.columns[i].name]) { out.push(i); }
  }
  if (!out.length) {
    for (var j = 0; j < t.columns.length; j++) { out.push(j); }
  }
  return out;
}

/* ============================================================ toast */
var toastTimer = null;
function toast(msg, isErr) {
  var n = $('toast');
  n.textContent = msg;
  n.className = 'toast' + (isErr ? ' err' : '');
  n.hidden = false;
  if (toastTimer) { clearTimeout(toastTimer); }
  toastTimer = setTimeout(function () { n.hidden = true; }, 2600);
}

/* ============================================================ boot */
function boot() {
  setTheme(currentTheme());
  bindEvents();
  window.__MHXX_TIMING.bootAt = now();
  if (!IDX) { showIndexMissing(); return; }
  renderSidebar();
  buildMenus();
  updateFoot();
  if (!TABLES.length) {
    showFatal('テーブルがありません',
      '<p>データは読み込めましたが、テーブルが 1 つも登録されていません。' +
      '<code>python tools/build.py</code> で再生成してください。</p>');
    return;
  }
  var first = null;
  var hash = (location.hash || '').replace(/^#/, '');
  if (hash) { first = tableById(hash); }
  if (!first) { first = TABLES[0]; }
  selectTable(first.id);
}

function updateFoot() {
  var html = '<div>' + TABLES.length + ' tables / ' + fmtNum(META.row_count || 0) + ' rows</div>';
  if (META.data_version) {
    html += '<div style="opacity:.75">' + esc(META.data_version.slice(0, 15)) + '…</div>';
  }
  $('sb-foot').innerHTML = html;
}

/* ============================================================ sidebar */
function renderSidebar() {
  var box = $('sb-list');
  box.innerHTML = '';
  if (!TABLES.length) { box.innerHTML = '<div class="grp">no data</div>'; return; }
  var areas = (META.areas && META.areas.length) ? META.areas : [{ id: '', title_ja: 'テーブル' }];
  for (var a = 0; a < areas.length; a++) {
    var area = areas[a];
    var group = [];
    for (var i = 0; i < TABLES.length; i++) {
      if (!area.id || TABLES[i].area === area.id) { group.push(TABLES[i]); }
    }
    if (!group.length) { continue; }
    box.appendChild(el('div', 'grp', area.title_ja + ' (' + group.length + ')'));
    for (var k = 0; k < group.length; k++) {
      var t = group[k];
      var item = el('div', 'titem');
      item.setAttribute('data-tid', t.id);
      item.title = t.id + ' — ' + fmtNum(t.row_count) + ' 行';
      item.appendChild(el('span', 'nm', t.title_ja));
      item.appendChild(el('span', 'ct', fmtNum(t.row_count)));
      box.appendChild(item);
    }
  }
  var items = box.querySelectorAll('.titem');
  for (var j = 0; j < items.length; j++) {
    items[j].addEventListener('click', function () {
      selectTable(this.getAttribute('data-tid'));
      $('sidebar').classList.remove('open');
    });
  }
}

function markSidebar() {
  var items = document.querySelectorAll('.titem');
  for (var i = 0; i < items.length; i++) {
    if (items[i].getAttribute('data-tid') === S.tableId) {
      items[i].classList.add('active');
    } else {
      items[i].classList.remove('active');
    }
  }
}

/* ============================================================ table switch */
var loadSeq = 0;

function selectTable(id) {
  var t = tableById(id);
  if (!t) { return; }
  var seq = ++loadSeq;
  S.tableId = id;
  S.q = '';
  S.fcol = '';
  S.fval = '';
  S.sortCol = -1;
  S.sortDir = 1;
  S.sel = new Set();
  S.page = 0;
  S.detail = -1;
  S.hidden = {};
  if (!S.pageSize) { S.pageSize = 200; }
  $('q').value = '';
  $('fval').value = '';
  closeDetail();
  $('tbl-name').textContent = t.title_ja;
  $('tbl-id').textContent = t.id + (t.title_en ? ' / ' + t.title_en : '');
  buildColFilter(t);
  markSidebar();
  try { location.hash = t.id; } catch (e) { /* noop */ }
  track('mhxx_table_select', { table_id: t.id, table_title: t.title_ja, rows: t.row_count });

  if (rowsOf(id)) { renderAll(); return; }
  showLoading('「' + t.title_ja + '」を読み込んでいます…');
  ensureTable(id).then(function () {
    if (seq !== loadSeq) { return; }
    renderAll();
  }, function (err) {
    if (seq !== loadSeq) { return; }
    showLoadError(t, err);
  });
}

function buildColFilter(t) {
  var sel = $('fcol');
  sel.innerHTML = '';
  var o0 = el('option', null, '列フィルタ: なし');
  o0.value = '';
  sel.appendChild(o0);
  for (var i = 0; i < t.columns.length; i++) {
    var c = t.columns[i];
    var o = el('option', null, c.name + (c.desc_ja ? ' — ' + c.desc_ja : ''));
    o.value = c.name;
    sel.appendChild(o);
  }
  sel.value = '';
}

/* ============================================================ view */
function getNorm(t, rows) {
  var c = S.normCache[t.id];
  if (!c) {
    c = new Array(rows.length);
    for (var i = 0; i < rows.length; i++) { c[i] = norm(rows[i].join('\u0001')); }
    S.normCache[t.id] = c;
  }
  return c;
}

function sortIdx(t, rows, idx) {
  var c = S.sortCol;
  var dir = S.sortDir;
  var numeric = isNumCol(t, c);
  idx.sort(function (a, b) {
    var va = rows[a][c] == null ? '' : rows[a][c];
    var vb = rows[b][c] == null ? '' : rows[b][c];
    if (numeric) {
      var na = va === '' ? null : Number(va);
      var nb = vb === '' ? null : Number(vb);
      if (na === null || isNaN(na)) { na = null; }
      if (nb === null || isNaN(nb)) { nb = null; }
      if (na === null && nb === null) { return a - b; }
      if (na === null) { return 1; }
      if (nb === null) { return -1; }
      if (na !== nb) { return (na < nb ? -1 : 1) * dir; }
      return a - b;
    }
    var ea = (va === '');
    var eb = (vb === '');
    if (ea && eb) { return a - b; }
    if (ea) { return 1; }
    if (eb) { return -1; }
    var r = cmpStr(va, vb);
    return (r ? r : (a - b)) * dir;
  });
}

function computeView() {
  var t = cur();
  var rows = curRows();
  if (!t || !rows) { S.view = []; return; }
  var q = norm(S.q.trim());
  var fval = norm(S.fval.trim());
  var fci = S.fcol ? colIndex(t, S.fcol) : -1;
  var cache = q ? getNorm(t, rows) : null;
  var idx = [];
  for (var i = 0; i < rows.length; i++) {
    if (cache && cache[i].indexOf(q) < 0) { continue; }
    if (fci >= 0 && fval && norm(rows[i][fci]).indexOf(fval) < 0) { continue; }
    idx.push(i);
  }
  if (S.sortCol >= 0 && S.sortCol < t.columns.length) { sortIdx(t, rows, idx); }
  S.view = idx;
}

function renderAll() {
  computeView();
  renderGrid();
  renderPager();
  renderCounts();
  hideState();
  if (!window.__MHXX_TIMING.firstRowsAt) {
    window.__MHXX_TIMING.firstRowsAt = now();
    track('mhxx_ready', { tables: TABLES.length, rows: META.row_count || 0, mode: S.mode });
  }
}

function refresh(resetPage) {
  if (!cur() || !curRows()) { return; }
  computeView();
  if (resetPage) { S.page = 0; }
  renderGrid();
  renderPager();
  renderCounts();
}

/* ============================================================ render */
function renderGrid() {
  var t = cur();
  var rows = curRows();
  if (!t) { return; }
  var cols = visibleCols(t);
  var thead = $('thead');
  var tbody = $('tbody');
  var h = [];
  h.push('<tr>');
  h.push('<th class="c-sel no-sort"><input type="checkbox" id="chk-page" title="このページを全選択"></th>');
  h.push('<th class="c-num no-sort">#</th>');
  for (var ci = 0; ci < cols.length; ci++) {
    var c = t.columns[cols[ci]];
    var cls = (isNumCol(t, cols[ci]) ? 'num ' : '') + (S.sortCol === cols[ci] ? (S.sortDir > 0 ? 'asc' : 'desc') : '');
    h.push('<th data-c="' + cols[ci] + '" class="' + cls + '" title="' + esc(c.name + (c.desc_ja ? ' — ' + c.desc_ja : '')) + '">' +
      '<span class="hn">' + esc(c.name) + '</span>' +
      (c.desc_ja ? '<span class="hd">' + esc(c.desc_ja) + '</span>' : '') + '</th>');
  }
  h.push('</tr>');
  thead.innerHTML = h.join('');

  if (!rows) { tbody.innerHTML = ''; return; }

  var total = S.view.length;
  var ps = S.pageSize || total || 1;
  var start = S.page * ps;
  if (start > total) { start = 0; S.page = 0; }
  var end = Math.min(start + ps, total);

  var b = [];
  for (var k = start; k < end; k++) {
    var ri = S.view[k];
    var row = rows[ri];
    var isSel = S.sel.has(ri);
    b.push('<tr data-i="' + ri + '"' + (isSel ? ' class="sel"' : '') + '>');
    b.push('<td class="c-sel"><input type="checkbox"' + (isSel ? ' checked' : '') + ' data-i="' + ri + '"></td>');
    b.push('<td class="c-num">' + (k + 1) + '</td>');
    for (var cj = 0; cj < cols.length; cj++) {
      b.push('<td' + (isNumCol(t, cols[cj]) ? ' class="num"' : '') + '>' + esc(row[cols[cj]]) + '</td>');
    }
    b.push('</tr>');
  }
  tbody.innerHTML = b.join('');

  var chk = $('chk-page');
  if (chk) {
    var allSel = (end > start);
    for (var m = start; m < end; m++) {
      if (!S.sel.has(S.view[m])) { allSel = false; break; }
    }
    chk.checked = allSel;
    chk.indeterminate = !allSel && (function () {
      for (var n = start; n < end; n++) { if (S.sel.has(S.view[n])) { return true; } }
      return false;
    })();
  }
}

function renderPager() {
  var total = S.view.length;
  var ps = S.pageSize || total || 1;
  var pages = Math.max(1, Math.ceil(total / ps));
  if (S.page > pages - 1) { S.page = pages - 1; }
  if (S.page < 0) { S.page = 0; }
  var start = S.page * ps;
  var end = Math.min(start + ps, total);
  $('pg-left').textContent = total
    ? (fmtNum(start + 1) + '–' + fmtNum(end) + ' / ' + fmtNum(total) + ' 行')
    : '0 行';

  var right = $('pg-right');
  right.innerHTML = '';
  right.appendChild(el('span', null, '表示件数'));
  var sel = el('select');
  sel.id = 'psize';
  var opts = [100, 200, 500, 1000, 2000, 0];
  for (var i = 0; i < opts.length; i++) {
    var o = el('option', null, opts[i] ? String(opts[i]) : '全件');
    o.value = String(opts[i]);
    if (opts[i] === S.pageSize) { o.selected = true; }
    sel.appendChild(o);
  }
  sel.addEventListener('change', function () {
    S.pageSize = parseInt(this.value, 10) || 0;
    S.page = 0;
    renderGrid();
    renderPager();
  });
  right.appendChild(sel);

  var b1 = el('button', 'btn', '«');
  b1.title = '先頭';
  b1.disabled = S.page <= 0;
  b1.addEventListener('click', function () { S.page = 0; renderGrid(); renderPager(); });
  right.appendChild(b1);

  var b2 = el('button', 'btn', '‹');
  b2.title = '前へ';
  b2.disabled = S.page <= 0;
  b2.addEventListener('click', function () { S.page--; renderGrid(); renderPager(); });
  right.appendChild(b2);

  var pin = el('input');
  pin.type = 'text';
  pin.id = 'pagein';
  pin.value = String(S.page + 1);
  pin.title = 'ページ番号';
  pin.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { goPage(parseInt(this.value, 10) - 1); this.blur(); }
  });
  pin.addEventListener('blur', function () { goPage(parseInt(this.value, 10) - 1); });
  right.appendChild(pin);
  right.appendChild(el('span', null, '/ ' + fmtNum(pages)));

  var b3 = el('button', 'btn', '›');
  b3.title = '次へ';
  b3.disabled = S.page >= pages - 1;
  b3.addEventListener('click', function () { S.page++; renderGrid(); renderPager(); });
  right.appendChild(b3);

  var b4 = el('button', 'btn', '»');
  b4.title = '末尾';
  b4.disabled = S.page >= pages - 1;
  b4.addEventListener('click', function () { S.page = pages - 1; renderGrid(); renderPager(); });
  right.appendChild(b4);
}

function goPage(p) {
  var total = S.view.length;
  var ps = S.pageSize || total || 1;
  var pages = Math.max(1, Math.ceil(total / ps));
  if (isNaN(p)) { p = 0; }
  if (p < 0) { p = 0; }
  if (p > pages - 1) { p = pages - 1; }
  S.page = p;
  renderGrid();
  renderPager();
}

function renderCounts() {
  var t = cur();
  if (!t) { $('counts').innerHTML = ''; return; }
  var total = t.row_count;
  $('counts').innerHTML =
    '<span>全件 <b>' + fmtNum(total) + '</b></span>' +
    '<span class="view">表示 <b>' + fmtNum(S.view.length) + '</b></span>' +
    '<span class="sel">選択 <b>' + fmtNum(S.sel.size) + '</b></span>';
}

/* ============================================================ selection */
function selectAllRows() {
  var rows = curRows();
  if (!rows) { return; }
  for (var i = 0; i < rows.length; i++) { S.sel.add(i); }
  renderGrid(); renderCounts();
  toast(fmtNum(S.sel.size) + ' 行を選択しました');
}
function selectViewRows() {
  if (!S.view.length) { toast('表示中の行がありません', true); return; }
  for (var i = 0; i < S.view.length; i++) { S.sel.add(S.view[i]); }
  renderGrid(); renderCounts();
  toast('表示中の ' + fmtNum(S.view.length) + ' 行を選択に追加しました');
}
function clearSelection() {
  S.sel = new Set();
  renderGrid(); renderCounts();
  toast('選択を解除しました');
}

/* ============================================================ export */
function scopeIndices(scope) {
  var rows = curRows();
  if (!rows) { return []; }
  if (scope === 'all') {
    var a = [];
    for (var i = 0; i < rows.length; i++) { a.push(i); }
    return a;
  }
  if (scope === 'view') { return S.view.slice(); }
  var inView = [];
  var seen = {};
  for (var k = 0; k < S.view.length; k++) {
    var ri = S.view[k];
    if (S.sel.has(ri)) { inView.push(ri); seen[ri] = 1; }
  }
  var rest = [];
  S.sel.forEach(function (v) { if (!seen[v]) { rest.push(v); } });
  rest.sort(function (x, y) { return x - y; });
  return inView.concat(rest);
}

function matrix(scope) {
  var t = cur();
  var rows = curRows();
  var cols = S.onlyVisible ? visibleCols(t) : (function () {
    var all = [];
    for (var i = 0; i < t.columns.length; i++) { all.push(i); }
    return all;
  })();
  var idx = scopeIndices(scope);
  var header = [];
  for (var c = 0; c < cols.length; c++) { header.push(t.columns[cols[c]].name); }
  var out = [];
  for (var r = 0; r < idx.length; r++) {
    var src = rows[idx[r]];
    var line = [];
    for (var d = 0; d < cols.length; d++) {
      var v = src[cols[d]];
      line.push(v == null ? '' : v);
    }
    out.push(line);
  }
  return { header: header, rows: out, count: idx.length };
}

function csvCell(v) {
  v = (v == null) ? '' : String(v);
  if (/[",\r\n]/.test(v)) { return '"' + v.replace(/"/g, '""') + '"'; }
  return v;
}
function toCSV(m) {
  var out = [m.header.map(csvCell).join(',')];
  for (var i = 0; i < m.rows.length; i++) { out.push(m.rows[i].map(csvCell).join(',')); }
  return out.join('\r\n') + '\r\n';
}
function toTSV(m) {
  function cell(v) {
    v = (v == null) ? '' : String(v);
    return v.replace(/[\t\r\n]+/g, ' ');
  }
  var out = [m.header.map(cell).join('\t')];
  for (var i = 0; i < m.rows.length; i++) { out.push(m.rows[i].map(cell).join('\t')); }
  return out.join('\r\n') + '\r\n';
}

function legacyCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-2000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function () { return true; }, function () {
      return legacyCopy(text);
    });
  }
  return Promise.resolve(legacyCopy(text));
}

function doCopy(scope, fmt) {
  var t = cur();
  if (!t || !curRows()) { return; }
  var m = matrix(scope);
  if (!m.count) { toast('対象の行がありません', true); return; }
  track('mhxx_copy', { scope: scope, format: fmt, rows: m.count, table_id: t.id });
  var text = (fmt === 'csv') ? toCSV(m) : toTSV(m);
  copyText(text).then(function (ok) {
    if (ok) { toast(fmtNum(m.count) + ' 行を ' + fmt.toUpperCase() + ' でコピーしました'); }
    else { toast('コピーできませんでした。ダウンロードをお使いください。', true); }
  });
}

function download(text, filename, mime) {
  var blob = new Blob(['\uFEFF' + text], { type: mime + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 0);
}

function doDownload(scope, fmt) {
  var t = cur();
  if (!t || !curRows()) { return; }
  var m = matrix(scope);
  if (!m.count) { toast('対象の行がありません', true); return; }
  track('mhxx_download', { scope: scope, format: fmt, rows: m.count, table_id: t.id });
  var text = (fmt === 'csv') ? toCSV(m) : toTSV(m);
  var name = 'mhxx-' + t.id + '-' + scope + '-' + stamp() + '.' + fmt;
  var mime = (fmt === 'csv') ? 'text/csv' : 'text/tab-separated-values';
  download(text, name, mime);
  toast(fmtNum(m.count) + ' 行を ' + name + ' として保存しました');
}

/* ============================================================ detail */
function openDetail(ri) {
  var t = cur();
  var rows = curRows();
  if (!t || !rows || ri < 0 || ri >= rows.length) { return; }
  track('mhxx_detail_open', { table_id: t.id, row_index: ri });
  S.detail = ri;
  var row = rows[ri];
  var pkv = row[colIndex(t, t.primary_key)];
  var h = [];
  h.push('<div class="dhead"><div style="flex:1">' +
    '<div class="dtitle">' + esc(t.title_ja) + '</div>' +
    '<div class="dsub">' + esc(t.id) + ' / 行 ' + (ri + 1) + ' ・ ' + esc(t.primary_key) + ' = ' + esc(pkv) + '</div>' +
    '</div><button class="x" data-act="close-detail" title="閉じる (Esc)">×</button></div>');
  h.push('<div class="dbody">');
  for (var i = 0; i < t.columns.length; i++) {
    var c = t.columns[i];
    var v = row[i] == null ? '' : row[i];
    h.push('<div class="drow">' +
      '<div class="dlabel"><span class="dname">' + esc(c.name) + '</span>' +
      '<span class="ddesc">' + esc(c.desc_ja || '') + '</span></div>' +
      '<div class="dval"><code>' + esc(v) + '</code>' +
      '<button class="mini" data-act="copy-val" data-v="' + esc(v) + '">コピー</button></div></div>');
  }
  h.push('</div>');
  var d = $('detail');
  d.innerHTML = h.join('');
  d.hidden = false;
  renderGrid();
}

function closeDetail() {
  S.detail = -1;
  var d = $('detail');
  if (d) { d.hidden = true; d.innerHTML = ''; }
}

/* ============================================================ definition */
function openDefinition() {
  var t = cur();
  if (!t) { return; }
  var h = [];
  h.push('<div class="mhead"><div class="dtitle" style="flex:1">' + esc(t.title_ja) +
    ' <span class="mono" style="color:var(--fg3);font-size:11px">' + esc(t.id) + '</span></div>' +
    '<button class="x" data-act="close-modal" title="閉じる (Esc)">×</button></div>');
  h.push('<div class="mbody">');
  h.push('<h4>基本情報</h4><dl class="kv">');
  h.push('<dt>id</dt><dd class="mono">' + esc(t.id) + '</dd>');
  h.push('<dt>title_ja</dt><dd>' + esc(t.title_ja) + '</dd>');
  h.push('<dt>title_en</dt><dd>' + esc(t.title_en || '—') + '</dd>');
  h.push('<dt>area</dt><dd class="mono">' + esc(t.area) + '</dd>');
  h.push('<dt>file</dt><dd class="mono">' + esc(t.file) + '</dd>');
  h.push('<dt>tsv</dt><dd class="mono">' + esc(t.tsv) + '</dd>');
  h.push('<dt>primary_key</dt><dd class="mono">' + esc(t.primary_key) + '</dd>');
  h.push('<dt>row_count</dt><dd class="mono">' + fmtNum(t.row_count) + '</dd>');
  h.push('<dt>id_range</dt><dd class="mono">' + (t.id_range ? (t.id_range[0] + ' – ' + t.id_range[1]) : '—') + '</dd>');
  h.push('<dt>confidence</dt><dd><span class="badge ' + esc(t.confidence) + '">' + esc(t.confidence) + '</span></dd>');
  h.push('</dl>');
  h.push('<h4>出典 (source)</h4>');
  if (t.source && t.source.length) {
    h.push('<ul class="srcs">');
    for (var s = 0; s < t.source.length; s++) { h.push('<li>' + esc(t.source[s]) + '</li>'); }
    h.push('</ul>');
  } else {
    h.push('<div style="color:var(--fg3)">（未設定）</div>');
  }
  if (t.notes_ja) { h.push('<h4>備考</h4><div>' + esc(t.notes_ja) + '</div>'); }
  h.push('<h4>列定義 (' + t.columns.length + ')</h4>');
  h.push('<table><thead><tr><th style="width:34px">#</th><th>列名</th><th style="width:60px">型</th><th>説明 (ja)</th><th>説明 (en)</th></tr></thead><tbody>');
  for (var i = 0; i < t.columns.length; i++) {
    var c = t.columns[i];
    h.push('<tr><td class="mono">' + (i + 1) + '</td><td class="mono">' + esc(c.name) + '</td><td class="mono">' +
      esc(c.type) + '</td><td>' + esc(c.desc_ja || '') + '</td><td>' + esc(c.desc_en || '') + '</td></tr>');
  }
  h.push('</tbody></table>');
  h.push('</div>');
  $('modal-box').innerHTML = h.join('');
  $('modal').hidden = false;
}

function closeModal() {
  $('modal').hidden = true;
  $('modal-box').innerHTML = '';
}

/* ============================================================ menus */
function closeMenus() {
  var ms = document.querySelectorAll('.menu');
  for (var i = 0; i < ms.length; i++) { ms[i].hidden = true; }
}

function buildMenus() {
  var scopes = [['sel', '選択行'], ['view', '表示中'], ['all', '全件']];
  var fmts = [['tsv', 'TSV'], ['csv', 'CSV']];
  var copyMenu = $('menu-copy');

function buildColMenu() {

        renderGrid();
        renderPager();

      lab.appendChild(cb);
      lab.appendChild(el('span', null, c.name + (c.desc_ja ? '  (' + c.desc_ja + ')' : '')));
      menu.appendChild(lab);
    })(t.columns[i]);

      if (t.columns[i].name !== t.primary_key) { S.hidden[t.columns[i].name] = true; }

    buildColMenu();
    renderGrid();

/* ============================================================ events */
var qTimer = null;
var fTimer = null;

function handleAct(node) {
  var a = node.getAttribute('data-act');
  if (a === 'sel-all') { selectAllRows(); }
  else if (a === 'sel-view') { selectViewRows(); }
  else if (a === 'sel-none') { clearSelection(); }
  else if (a === 'def') { openDefinition(); }
  else if (a === 'close-detail') { closeDetail(); }
  else if (a === 'close-modal') { closeModal(); }
  else if (a === 'reload') { location.reload(); }
  else if (a === 'mem-pick') { memPick(node.getAttribute('data-key')); }
  else if (a === 'mem-copy') { memCopy(parseInt(node.getAttribute('data-len'), 10) || 6); }
  else if (a === 'copy-val') {
    copyText(node.getAttribute('data-v')).then(function (ok) {
      toast(ok ? 'コピーしました' : 'コピーできませんでした', !ok);
    });
  }
}

function bindEvents() {
  $('btn-theme').addEventListener('click', toggleTheme);
  $('btn-menu').addEventListener('click', function () { $('sidebar').classList.toggle('open'); });

  $('q').addEventListener('input', function () {
    var v = this.value;
    if (qTimer) { clearTimeout(qTimer); }
    qTimer = setTimeout(function () {
      S.q = v;
      refresh(true);
      /* 検索文字列そのものは送らない（長さと件数だけ） */
      track('mhxx_search', { query_len: v.length, results: S.view.length, table_id: S.tableId });
    }, 110);
  });
  $('fcol').addEventListener('change', function () {
    S.fcol = this.value;
    refresh(true);
    if (this.value) { $('fval').focus(); }
  });
  $('fval').addEventListener('input', function () {
    var v = this.value;
    if (fTimer) { clearTimeout(fTimer); }
    fTimer = setTimeout(function () { S.fval = v; refresh(true); }, 110);
  });
  $('btn-clear').addEventListener('click', function () {
    S.q = ''; S.fcol = ''; S.fval = '';
    $('q').value = ''; $('fcol').value = ''; $('fval').value = '';
    refresh(true);
    $('q').focus();
  });

  document.addEventListener('click', function (ev) {
    var n = ev.target;
    while (n && n !== document.body) {
      if (n.getAttribute && n.getAttribute('data-act')) { handleAct(n); return; }
      n = n.parentNode;
    }
  });

  var mbs = document.querySelectorAll('.menubtn');
  for (var j = 0; j < mbs.length; j++) {
    (function (btn) {
      btn.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = btn.getAttribute('data-menu');
        var menu = $(id);
        var wasOpen = !menu.hidden;
        closeMenus();
        if (!wasOpen) {
          if (id === 'menu-cols') { buildColMenu(); }
          menu.hidden = false;
        }
      });
    })(mbs[j]);
  }

  document.addEventListener('click', function (ev) {
    var n = ev.target;
    while (n && n !== document.body) {
      if (n.classList && (n.classList.contains('menu') || n.classList.contains('menubtn'))) { return; }
      n = n.parentNode;
    }
    closeMenus();
  });

  $('thead').addEventListener('click', function (ev) {
    var th = ev.target;
    while (th && th.tagName !== 'TH') { th = th.parentNode; }
    if (!th || !th.getAttribute) { return; }
    var cs = th.getAttribute('data-c');
    if (cs === null) { return; }
    var c = parseInt(cs, 10);
    if (S.sortCol === c) {
      if (S.sortDir === 1) { S.sortDir = -1; } else { S.sortCol = -1; S.sortDir = 1; }
    } else {
      S.sortCol = c;
      S.sortDir = 1;
    }
    var ct = cur();
    track('mhxx_sort', {
      table_id: S.tableId,
      column: (ct && S.sortCol >= 0) ? ct.columns[S.sortCol].name : '',
      dir: (S.sortCol < 0) ? 'none' : (S.sortDir > 0 ? 'asc' : 'desc')
    });
    refresh(false);
  });

  $('tbody').addEventListener('click', function (ev) {
    var n = ev.target;
    if (n && n.tagName === 'INPUT') { return; }
    while (n && n.tagName !== 'TR') { n = n.parentNode; }
    if (!n || !n.getAttribute) { return; }
    var ri = parseInt(n.getAttribute('data-i'), 10);
    if (isNaN(ri)) { return; }
    openDetail(ri);
  });

  $('tbody').addEventListener('change', function (ev) {
    var n = ev.target;
    if (!n || n.tagName !== 'INPUT') { return; }
    var ri = parseInt(n.getAttribute('data-i'), 10);
    if (isNaN(ri)) { return; }
    if (n.checked) { S.sel.add(ri); } else { S.sel.delete(ri); }
    var tr = n.parentNode.parentNode;
    if (tr && tr.classList) {
      if (n.checked) { tr.classList.add('sel'); } else { tr.classList.remove('sel'); }
    }
    var chk = $('chk-page');
    if (chk) { chk.indeterminate = true; }
    renderCounts();
  });

  document.addEventListener('change', function (ev) {
    var n = ev.target;
    if (n && n.id === 'chk-page') {
      var total = S.view.length;
      var ps = S.pageSize || total || 1;
      var start = S.page * ps;
      var end = Math.min(start + ps, total);
      for (var k = start; k < end; k++) {
        if (n.checked) { S.sel.add(S.view[k]); } else { S.sel.delete(S.view[k]); }
      }
      renderGrid();
      renderCounts();
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && !isTyping(ev.target)) {
      ev.preventDefault();
      $('q').focus();
      $('q').select();
      return;
    }
    if (ev.key === 'Escape') {
      if (!$('modal').hidden) { closeModal(); return; }
      if (!$('detail').hidden) { closeDetail(); return; }
      closeMenus();
      if (S.q || S.fcol || S.fval) {
        S.q = ''; S.fcol = ''; S.fval = '';
        $('q').value = ''; $('fcol').value = ''; $('fval').value = '';
        refresh(true);
      } else if (isTyping(ev.target)) {
        ev.target.blur();
      }
      return;
    }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'q') { refresh(true); }
  });

  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace(/^#/, '');
    if (h && h !== S.tableId && tableById(h)) { selectTable(h); }
  });

  memBind();
}

function pickNum(obj, names, dflt) {
  if (!obj) { return dflt; }
  for (var i = 0; i < names.length; i++) {
    var v = obj[names[i]];
    if (typeof v === 'number' && isFinite(v)) { return v; }
  }
  return dflt;
}

/* analyst の equip-record-layout.json（入れ子スキーマ）と旧フラット形式の両方を読む */
function normalizeLayout(raw) {
  raw = raw || {};
  var box = raw.box || null;
  var rec = raw.record || null;
  var pg = raw.page_geometry || null;
  var L = {
    recordSize: pickNum(box, ['record_bytes'], pickNum(raw, ['record_size', 'recordSize', 'size', 'record_bytes'], 36)),
    recordCount: pickNum(box, ['record_count'], pickNum(raw, ['record_count', 'recordCount', 'count'], 2000)),
    saveOffset: pickNum(box, ['offset_from_slot_base'], pickNum(raw, ['save_offset', 'saveOffset', 'box_offset', 'offset'], 0x62EE)),
    pageSize: pickNum(pg, ['slots_per_page'], pickNum(raw, ['page_size', 'pageSize'], 9)),
    pageCount: pickNum(pg, ['page_count'], 0),
    talisman: raw.talisman || null,
    typeMap: Array.isArray(raw.type_map) ? raw.type_map : null,
    source: raw.generated_by || raw.source || '',
    confidence: raw.confidence || ''
  };
  var f = (rec && Array.isArray(rec.fields) && rec.fields.length) ? rec.fields
        : (Array.isArray(raw.fields) && raw.fields.length ? raw.fields : DEFAULT_FIELDS);
  L.fields = f;
  return L;
}

function loadLayout() {
  if (window.MHXX_EQUIP_LAYOUT) {
    M.layout = normalizeLayout(window.MHXX_EQUIP_LAYOUT);
    return Promise.resolve();
  }
  return new Promise(function (resolve) {
    var s = document.createElement('script');
    s.src = 'data/equip-record-layout.js';
    s.async = true;
    s.onload = function () { M.layout = normalizeLayout(window.MHXX_EQUIP_LAYOUT || {}); resolve(); };
    s.onerror = function () { M.layout = normalizeLayout({}); resolve(); };
    document.head.appendChild(s);
  });
}

function dataOf(id) {
  var s = window.MHXX_ID_MEMO_TABLES;
  var e = s && s[id];
  if (!e) { return null; }
  if (!e._idx) {
    var idx = {};
    for (var i = 0; i < e.header.length; i++) { idx[e.header[i]] = i; }
    e._idx = idx;
  }
  return { rows: e.rows, idx: e._idx };
}

function memEnsure() {
  var need = ['armor', 'weapons', 'talismans', 'skills', 'decorations', 'weapon-types', 'armor-parts'];
  var jobs = [];
  for (var i = 0; i < need.length; i++) {
    if (tableById(need[i])) { jobs.push(ensureTable(need[i])); }
  }
  return Promise.all(jobs).then(loadLayout);
}

function weaponTypeValue(wtypeId) {
  var d = dataOf('weapon-types');
  if (d) {
    for (var i = 0; i < d.rows.length; i++) {
      if (Number(d.rows[i][d.idx.weapon_type_id]) === wtypeId) {
        var e = Number(d.rows[i][d.idx.equip_type_id]);
        if (e) { return e; }
      }
    }
  }
  return wtypeId + 7;
}

function typeLabel(type) {
  if (type >= 1 && type <= 5) {
    var d = dataOf('armor-parts');
    var nm = '';
    if (d) {
      for (var i = 0; i < d.rows.length; i++) {
        if (Number(d.rows[i][d.idx.part_id]) === type - 1) { nm = d.rows[i][d.idx.name_ja]; }
      }
    }
    return '防具' + (nm ? '（' + nm + '）' : '');
  }
  if (type === 6) { return '護石'; }
  var w = dataOf('weapon-types');
  if (w) {
    for (var j = 0; j < w.rows.length; j++) {
      if (Number(w.rows[j][w.idx.equip_type_id]) === type) {
        return '武器（' + w.rows[j][w.idx.name_ja] + '）';
      }
    }
  }
  return '不明';
}

function kindRarity(kind) {
  var d = dataOf('talismans');
  if (d) {
    for (var i = 0; i < d.rows.length; i++) {
      if (Number(d.rows[i][d.idx.talisman_id]) === kind) {
        return pickNum({ v: Number(d.rows[i][d.idx.rarity]) }, ['v'], 99);
      }
    }
  }
  return 99;
}

function skillName(id) {
  var d = dataOf('skills');
  if (!d || !id) { return id ? ('skill_id ' + id) : 'なし'; }
  for (var i = 0; i < d.rows.length; i++) {
    if (Number(d.rows[i][d.idx.skill_id]) === id) { return d.rows[i][d.idx.name_ja]; }
  }
  return 'skill_id ' + id;
}

/* ---------- 一覧 ---------- */
function memListItems() {
  var out = [];
  if (M.cat === 'armor') {
    var d = dataOf('armor');
    if (!d) { return out; }
    var seen = {};
    for (var i = 0; i < d.rows.length; i++) {
      var r = d.rows[i];
      if (Number(r[d.idx.part_id]) !== M.part) { continue; }
      var sid = Number(r[d.idx.series_id]);
      if (!sid) { continue; }  /* series 0 = 装備なし（実在しないパターンになるため除外） */
      if (seen[sid]) { continue; }
      seen[sid] = 1;
      out.push({ key: 'a' + sid, kind: 'armor', type: M.part + 1, id: sid, name: r[d.idx.name_ja], en: r[d.idx.name_en], sub: 'series_id ' + sid });
    }
  } else if (M.cat === 'weapon') {
    var dw = dataOf('weapons');
    if (!dw) { return out; }
    var seen2 = {};
    var tv = weaponTypeValue(M.wtype);
    for (var j = 0; j < dw.rows.length; j++) {
      var w = dw.rows[j];
      if (Number(w[dw.idx.weapon_type_id]) !== M.wtype) { continue; }
      var wi = Number(w[dw.idx.weapon_index]);
      if (!wi) { continue; }  /* weapon_index 0 = 装備なし */
      if (seen2[wi]) { continue; }
      seen2[wi] = 1;
      out.push({ key: 'w' + wi, kind: 'weapon', type: tv, id: wi, name: w[dw.idx.name_ja], en: w[dw.idx.name_en], sub: 'weapon_index ' + wi });
    }
  } else {
    var dt = dataOf('talismans');
    if (!dt) { return out; }
    for (var k = 0; k < dt.rows.length; k++) {
      var t = dt.rows[k];
      var kid = Number(t[dt.idx.talisman_id]);
      if (!kid) { continue; }
      out.push({ key: 'k' + kid, kind: 'talisman', type: 6, id: kid, name: t[dt.idx.name_ja], en: t[dt.idx.name_en], sub: 'kind ' + kid });
    }
  }
  return out;
}

function memRenderList() {
  var items = memListItems();
  var q = norm(M.query.trim());
  var filtered = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (q && norm(it.name + '\u0001' + (it.en || '')).indexOf(q) < 0) { continue; }
    filtered.push(it);
  }
  var shown = filtered.slice(0, 400);
  var html = [];
  for (var k = 0; k < shown.length; k++) {
    var s = shown[k];
    var on = (M.selected && M.selected.key === s.key) ? ' on' : '';
    html.push('<button type="button" class="mem-item' + on + '" data-act="mem-pick" data-key="' + esc(s.key) + '">' +
      '<span class="id">' + esc(s.sub) + '</span>' +
      '<span class="nm">' + esc(s.name || '(名前なし)') + '</span>' +
      (s.en ? '<span class="sub">' + esc(s.en) + '</span>' : '') +
      '</button>');
  }
  $('mem-list').innerHTML = html.length ? html.join('') : '<div class="mem-empty">該当する装備がありません</div>';
  $('mem-count').textContent = filtered.length
    ? (filtered.length > shown.length
        ? filtered.length + ' 件中 ' + shown.length + ' 件を表示（絞り込んでください）'
        : filtered.length + ' 件')
    : '';
}

/* ---------- レコード生成 ---------- */
function clampInt(v, lo, hi, dflt) {
  v = parseInt(v, 10);
  if (isNaN(v)) { v = dflt; }
  if (v < lo) { v = lo; }
  if (v > hi) { v = hi; }
  return v;
}
function hex2(n) { return ('0' + (n & 0xFF).toString(16).toUpperCase()).slice(-2); }
function hex4(n) { return ('000' + (n & 0xFFFF).toString(16).toUpperCase()).slice(-4); }
function put16(b, off, v) {
  b[off] = v & 0xFF;
  b[off + 1] = (v >> 8) & 0xFF;
}
function get16(b, off) {
  return (b[off] | (b[off + 1] << 8)) & 0xFFFF;
}

function buildRecord(sel) {
  var L = M.layout || normalizeLayout({});
  var b = new Uint8Array(L.recordSize);

  if (sel.kind === 'talisman') {
    var k = clampInt(M.tal.kind, 0, 10, 10);
    b[0] = 6; b[1] = 0;
    b[2] = k; b[3] = 0;
    put16(b, 4, 0);
    put16(b, 6, M.decos[0] || 0);
    put16(b, 8, M.decos[1] || 0);
    put16(b, 10, M.decos[2] || 0);
    b[12] = clampInt(M.tal.skill1, 0, 255, 0) & 0xFF;
    b[13] = clampInt(M.tal.skill2, 0, 255, 0) & 0xFF;
    b[14] = clampInt(M.tal.p1, -128, 127, 0) & 0xFF;
    b[15] = clampInt(M.tal.p2, -128, 127, 0) & 0xFF;
    b[16] = clampInt(M.tal.slots, 0, 3, 0);
    b[17] = 0;
    b[18] = kindRarity(k) & 0xFF;
    b[19] = 1;
    return b;
  }

  var lv = clampInt(M.level, 1, 31, 1);
  var tl = clampInt(M.tl, 1, 31, 1);
  var w0 = (sel.type & 0x1F) | (((lv - 1) & 0x1F) << 5) | (((tl - 1) & 0x1F) << 10);
  put16(b, 0, w0);
  put16(b, 2, sel.id & 0xFFFF);
  put16(b, 4, clampInt(M.tm, 0, 65535, 0));
  put16(b, 6, M.decos[0] || 0);
  put16(b, 8, M.decos[1] || 0);
  put16(b, 10, M.decos[2] || 0);
  return b;
}

/* 36 バイトのレコードを len バイトのパターンに拡張する（足りない分は 0 = 空き枠） */
function patternBytes(rec, len) {
  if (len <= rec.length) { return rec; }
  var out = new Uint8Array(len);
  out.set(rec.subarray(0, Math.min(rec.length, len)), 0);
  return out;
}

function formatBytes(b, len, fmt) {
  var vals = [];
  for (var i = 0; i < len; i++) { vals.push(b[i] === undefined ? 0 : b[i]); }
  if (fmt === 'compact') { return vals.map(function (v) { return hex2(v); }).join(''); }
  if (fmt === 'escaped') { return vals.map(function (v) { return '\\x' + hex2(v); }).join(''); }
  if (fmt === 'carray') { return '{ ' + vals.map(function (v) { return '0x' + hex2(v); }).join(', ') + ' }'; }
  if (fmt === 'dec') { return vals.join(' '); }
  return vals.map(function (v) { return hex2(v); }).join(' ');
}

function recommendedLen(sel) {
  return (sel && sel.kind === 'talisman') ? 20 : 12;
}

/* ---------- 描画 ---------- */
function memRenderRecord() {
  var L = M.layout || normalizeLayout({});
  var sel = M.selected;
  var main = $('mem-copy-main');
  if (!sel) {
    $('mem-hex').innerHTML = '<span class="mem-note">上の一覧から装備を選んでください。</span>';
    $('mem-legend').innerHTML = '';
    $('mem-annot').innerHTML = '';
    $('mem-pats').innerHTML = '<div class="mem-note">装備を選ぶとスキャンパターンが出ます。</div>';
    if (main) { main.disabled = true; }
    $('mem-copy-note').textContent = '';
    return;
  }
  if (main) { main.disabled = false; }
  var b = buildRecord(sel);

  var chips = [];
  var legend = [];
  for (var i = 0; i < L.fields.length; i++) {
    var f = L.fields[i];
    var cls = 'f' + (i % 7);
    var parts = [];
    for (var k = 0; k < f.size; k++) {
      var off = f.offset + k;
      parts.push(hex2(b[off] === undefined ? 0 : b[off]));
    }
    chips.push('<span class="' + cls + '" title="+0x' + hex2(f.offset) + ' ' + esc(f.name) + '">' + parts.join(' ') + '</span>');
    legend.push('<span class="' + cls + '">' + esc(f.name) + '</span>');
  }
  $('mem-hex').innerHTML = chips.join('');
  $('mem-legend').innerHTML = '<div class="hex" style="margin:0;gap:8px">' + legend.join('') + '</div>';

  var rows = [];
  function row(k, v) { rows.push('<dt>' + esc(k) + '</dt><dd>' + v + '</dd>'); }

  if (sel.kind === 'talisman') {
    var kind = b[2];
    var s1 = b[12], s2 = b[13];
    var p1 = (b[14] << 24) >> 24, p2 = (b[15] << 24) >> 24;
    row('+0x00 type', '0x' + hex2(b[0]) + '（type 6 = 護石, level 1）');
    row('+0x02 kind', '0x' + hex2(kind) + ' = ' + kind + '（' + esc(sel.name || '') + '）');
    row('+0x06 deco1..3', hex2(b[6]) + ' ' + hex2(b[7]) + ' / ' + hex2(b[8]) + ' ' + hex2(b[9]) + ' / ' + hex2(b[10]) + ' ' + hex2(b[11]));
    row('+0x0C skill1', '0x' + hex2(s1) + ' = ' + s1 + '（' + esc(skillName(s1)) + '） ポイント ' + p1);
    row('+0x0D skill2', '0x' + hex2(s2) + ' = ' + s2 + '（' + esc(skillName(s2)) + '） ポイント ' + p2);
    row('+0x10 slots', '0x' + hex2(b[16]) + ' = ' + b[16] + ' 枠');
    row('+0x12 rarity', '0x' + hex2(b[18]) + ' = ' + b[18] + '（kind から自動）');
    row('+0x13', '0x' + hex2(b[19]) + '（固定 0x01）');
    row('+0x14..0x23 tail', '16 バイト（護石では常に 0）');
  } else {
    var w0 = get16(b, 0);
    var type = w0 & 0x1F;
    var lv = ((w0 >> 5) & 0x1F) + 1;
    var tl = ((w0 >> 10) & 0x1F) + 1;
    row('+0x00 head', '0x' + hex4(w0) + ' → type=' + type + '（' + esc(typeLabel(type)) + '）, level=' + lv + ', 着せ替えLv=' + tl + ', bit15=0');
    row('+0x02 id', '0x' + hex4(get16(b, 2)) + ' = ' + get16(b, 2) + '（' + esc(sel.name || '') + '）');
    if (sel.kind === 'armor') {
      row('+0x02 → armor_id', 'id*5 + (type-1) = ' + (get16(b, 2) * 5 + (type - 1)));
    } else if (sel.kind === 'weapon') {
      row('+0x02 → weapon_id', '(type-7)*10000 + id*10 = ' + ((type - 7) * 10000 + get16(b, 2) * 10) + '（form 0）');
    }
    row('+0x04 transmog', '0x' + hex4(get16(b, 4)) + (get16(b, 4) ? '' : '（なし）'));
    for (var d = 0; d < 3; d++) {
      var dv = get16(b, 6 + d * 2);
      row('+0x0' + (6 + d * 2).toString(16).toUpperCase() + ' deco' + (d + 1), '0x' + hex4(dv) + (dv ? '（item_id ' + dv + '）' : '（なし）'));
    }
    row('+0x0C..0x23 tail', '24 バイト — <b>通常は 0 ですが、前の持ち主のバイトが残ることがあります</b>');
  }
  $('mem-annot').innerHTML = rows.join('');

  var rl = recommendedLen(sel);
  if (main) {
    main.setAttribute('data-len', String(rl));
    main.textContent = '推奨 ' + rl + ' バイトをコピー';
  }
  $('mem-copy-note').textContent = (sel.kind === 'talisman')
    ? '護石は +0x0C 以降のスキル情報まで含めないと一致しません。'
    : 'head + id + 着せ替え + 装飾品3 まで。tail の残骸に影響されません。';

  memRenderPatterns(b, sel);
}

function memRenderPatterns(b, sel) {
  var L = M.layout || normalizeLayout({});
  var rec = recommendedLen(sel);
  var pats = [];
  pats.push({ label: rec + ' バイト（推奨）', len: rec, note: 'tail の残骸に影響されない。まずこれで検索' });
  if (sel.kind === 'talisman') {
    pats.push({ label: '12 バイト', len: 12, note: 'head + kind + 装飾品（護石では絞り込みが弱い）' });
  } else {
    pats.push({ label: '6 バイト', len: 6, note: '最短。実測では 19 件中 14 件が一意、5 件は 3〜4 ヒット' });
  }
  pats.push({ label: '72 バイト（隣の枠が空）', len: 72, note: '36B レコード + 空き枠 36B。実測で 1 ヒットになりやすい' });
  pats.push({ label: '36 バイト', len: 36, note: 'tail がゼロのときのみ有効（残骸があると取りこぼす）' });

  var fmts = [
    ['space', 'スペース区切り'],
    ['compact', '連続'],
    ['escaped', '\\xNN'],
    ['carray', 'C 配列'],
    ['dec', '10 進']
  ];
  var html = [];
  html.push('<div class="pat"><span class="lbl">コピー形式</span>' +
    '<select id="mem-fmt" style="flex:0 0 auto">' +
    fmts.map(function (f) {
      return '<option value="' + f[0] + '"' + (M.fmt === f[0] ? ' selected' : '') + '>' + f[1] + '</option>';
    }).join('') +
    '</select></div>');
  for (var i = 0; i < pats.length; i++) {
    var n = pats[i].len;
    var pb = patternBytes(b, n);
    html.push('<div class="pat"><span class="lbl">' + pats[i].label + '</span>' +
      '<code>' + esc(formatBytes(pb, n, M.fmt)) + '</code>' +
      '<button type="button" class="mini" data-act="mem-copy" data-len="' + n + '">コピー</button></div>');
    if (pats[i].note) {
      html.push('<div class="mem-note" style="margin:-4px 0 8px 120px">' + esc(pats[i].note) + '</div>');
    }
  }
  html.push('<div class="mem-note" style="margin-top:10px">' +
    '<b>絞り込みのヒント（実測）:</b> 6 バイトは 19 件中 14 件が一意、5 件は 3〜4 ヒットでした。' +
    '装備が 1 件だけの箱なら <b>72 バイト（隣の枠が空）</b>が最も確実です。' +
    'ヒットが複数出たら <b>36 バイト間隔で並んでいるもの</b>と <b>36 の倍数境界</b>で絞ってください。' +
    '空レコード（全 0）は 6 バイトだと数百万ヒットするので使えません。' +
    '<br>補助条件: head word の <b>bit15 = 0</b>（生成値は常に 0）、type は <b>1..11, 13..21</b>（12 は欠番）。' +
    '</div>');
  $('mem-pats').innerHTML = html.join('');
  var selEl = $('mem-fmt');
  if (selEl) {
    selEl.addEventListener('change', function () {
      M.fmt = this.value;
      if (M.selected) { memRenderPatterns(buildRecord(M.selected), M.selected); }
    });
  }
}

function memRenderCalc() {
  var L = M.layout || normalizeLayout({});
  var html = [];
  html.push('<div class="mem-box"><div class="k">box index → スロット内オフセット（主）</div>' +
    '<input id="mem-idx" type="number" min="0" max="' + (L.recordCount - 1) + '" value="0" aria-label="BOX index">' +
    '<div class="v" id="mem-idx-out">—</div></div>');
  html.push('<div class="mem-box"><div class="k">ヒットしたアドレス → ボックス先頭 / slot base</div>' +
    '<input id="mem-hit" type="text" placeholder="例: 0x1A2B3C4D" aria-label="ヒットしたアドレス">' +
    '<input id="mem-hit-idx" type="number" min="0" value="0" aria-label="BOX index">' +
    '<div class="v" id="mem-hit-out">—</div></div>');
  html.push('<div class="mem-box"><div class="k">ページ番号 → index（参考: エディタ基準 ' + L.pageSize + ' 枠/ページ' +
    (L.pageCount ? '・全 ' + L.pageCount + ' ページ' : '') + '）</div>' +
    '<input id="mem-page" type="number" min="1" value="1" aria-label="ページ番号">' +
    '<div class="v" id="mem-page-out">—</div></div>');
  $('mem-calc').innerHTML = html.join('');

  function updIdx() {
    var i = clampInt($('mem-idx').value, 0, L.recordCount - 1, 0);
    var off = L.saveOffset + i * L.recordSize;
    var pg = Math.floor(i / L.pageSize), rw = i % L.pageSize;
    $('mem-idx-out').innerHTML = '0x' + off.toString(16).toUpperCase() + '（' + off + '）' +
      '<br><span style="color:var(--fg3);font-size:11px">参考: ' + (pg + 1) + ' ページ目の ' + (rw + 1) + ' 行目（エディタ基準）</span>';
  }
  function updHit() {
    var raw = ($('mem-hit').value || '').trim().replace(/^0x/i, '');
    var addr = parseInt(raw, 16);
    var i = clampInt($('mem-hit-idx').value, 0, L.recordCount - 1, 0);
    if (isNaN(addr)) { $('mem-hit-out').textContent = '—'; return; }
    var boxStart = addr - i * L.recordSize;
    var slotBase = boxStart - L.saveOffset;
    $('mem-hit-out').innerHTML =
      'ボックス先頭 = 0x' + (boxStart >>> 0).toString(16).toUpperCase() +
      '<br>slot base = 0x' + (slotBase >>> 0).toString(16).toUpperCase() +
      '<br><span style="color:var(--fg3);font-size:11px">A - i×' + L.recordSize + ' / A - i×' + L.recordSize + ' - 0x' + L.saveOffset.toString(16).toUpperCase() + '</span>';
  }
  function updPage() {
    var p = clampInt($('mem-page').value, 1, 100000, 1);
    var a = (p - 1) * L.pageSize;
    var b2 = Math.min(a + L.pageSize - 1, L.recordCount - 1);
    $('mem-page-out').innerHTML = 'index ' + a + ' 〜 ' + b2 +
      '<br><span style="color:var(--fg3);font-size:11px">ゲーム本体の 1 ページ枠数は未確定（エディタ基準の値）</span>';
  }
  $('mem-idx').addEventListener('input', updIdx);
  $('mem-hit').addEventListener('input', updHit);
  $('mem-hit-idx').addEventListener('input', updHit);
  $('mem-page').addEventListener('input', updPage);
  updIdx(); updPage();
}

function memRenderHelp() {
  var L = M.layout || normalizeLayout({});
  var html = [];
  html.push('<ol>');
  html.push('<li>装備を選ぶと 36 バイトのレコードと検索用 hex が出ます。<b>「推奨 N バイトをコピー」</b>でそのまま検索できます。</li>');
  html.push('<li>エミュレータ（Ryujinx など）のメモリ検索で、コピーした hex を <b>16 進数</b>として検索します。</li>');
  html.push('<li>値は <b>リトルエンディアン</b>です。type=1, id=3 なら <code>01 00 03 00</code>（u16 の 0x0001, 0x0003）。</li>');
  html.push('<li>ヒットしたアドレス A と box index i から、<b>ボックス先頭 = A - i×' + L.recordSize + '</b>、<b>slot base = A - i×' + L.recordSize + ' - 0x' + L.saveOffset.toString(16).toUpperCase() + '</b> です。</li>');
  html.push('<li>スロット内の位置は <code>0x' + L.saveOffset.toString(16).toUpperCase() + ' + index×' + L.recordSize + '</code>（index は 0 始まり、全 ' + L.recordCount + ' 枠）。</li>');
  html.push('<li><b>tail（+0x0C 以降）は前の持ち主のバイトが残ることがあります。</b>36 バイト全体パターンは tail がゼロのときだけ使ってください。</li>');
  html.push('<li>ヒット数（実測）: 6 バイトは 19 件中 14 件が一意・5 件は 3〜4 ヒット。<b>隣の枠が空なら 72 バイト（36B + 空き 36B）が 1 ヒット</b>で最も確実。空レコード（全 0）は 6 バイトだと数百万ヒットします。</li>');
  html.push('<li>護石は +0x0C 以降にスキル情報があり、装備本体と構造が違います（このツールは護石用に別途組み立てます）。</li>');
  html.push('</ol>');
  html.push('<div class="mem-note" style="margin-top:8px">レイアウト出典: ' +
    esc(L.source || '既定値') + (L.confidence ? '（confidence: ' + esc(L.confidence) + '）' : '') + '</div>');
  $('mem-help').innerHTML = html.join('');
}

function memRenderAll() {
  memRenderList();
  memRenderRecord();
  memRenderCalc();
  memRenderHelp();
}

/* ---------- 操作 ---------- */
function memPick(key) {
  var items = memListItems();
  for (var i = 0; i < items.length; i++) {
    if (items[i].key === key) {
      M.selected = items[i];
      if (items[i].kind === 'talisman') { M.tal.kind = items[i].id; }
      track('mhxx_memory_pick', { category: M.cat, name: items[i].name, type: items[i].type, id: items[i].id });
      memRenderList();
      memRenderRecord();
      return;
    }
  }
}

function memCopy(len) {
  if (!M.selected) { return; }
  var b = buildRecord(M.selected);
  var n = len;
  var pb = patternBytes(b, n);  /* 72 バイトなど、レコードより長いパターンにも対応 */
  track('mhxx_memory_copy', { bytes: n, category: M.cat });
  copyText(formatBytes(pb, n, M.fmt)).then(function (ok) {
    toast(ok ? n + ' バイトをコピーしました' : 'コピーできませんでした', !ok);
  });
}

function setMode(m) {
  S.mode = m;
  var isMem = (m === 'mem');
  $('toolbar').hidden = isMem;
  $('gridwrap').hidden = isMem;
  $('mem').hidden = !isMem;
  $('counts').hidden = isMem;
  if (isMem) { $('pager').hidden = true; }
  var bs = document.querySelectorAll('#mode-switch button');
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute('data-mode') === m;
    if (on) { bs[i].classList.add('on'); } else { bs[i].classList.remove('on'); }
    bs[i].setAttribute('aria-selected', on ? 'true' : 'false');
  }
  track('mhxx_mode_change', { mode: m });
  if (isMem) { memInit(); }
  else if (cur() && curRows()) { renderAll(); }
}

function memInit() {
  if (M.ready) { memRenderAll(); return; }
  if (M.loading) { return; }
  M.loading = true;
  $('mem-list').innerHTML = '<div class="mem-empty">読み込んでいます…</div>';
  memEnsure().then(function () {
    M.loading = false;
    M.ready = true;
    memBuildSelects();
    memRenderAll();
  }, function (err) {
    M.loading = false;
    $('mem-list').innerHTML = '<div class="mem-empty">データを読み込めませんでした: ' +
      esc(err && err.message ? err.message : err) + '</div>';
  });
}

function memBind() {
  $('mem-cat').addEventListener('change', function () {
    M.cat = this.value;
    M.selected = null;
    M.query = '';
    $('mem-search').value = '';
    $('mem-part-wrap').hidden = (M.cat !== 'armor');
    $('mem-wtype-wrap').hidden = (M.cat !== 'weapon');
    $('mem-tal-opts').hidden = (M.cat !== 'talisman');
    memRenderList();
    memRenderRecord();
  });
  $('mem-part').addEventListener('change', function () {
    M.part = parseInt(this.value, 10) || 0;
    M.selected = null;
    memRenderList();
    memRenderRecord();
  });
  $('mem-wtype').addEventListener('change', function () {
    M.wtype = parseInt(this.value, 10) || 0;
    M.selected = null;
    memRenderList();
    memRenderRecord();
  });
  var t = null;
  $('mem-search').addEventListener('input', function () {
    var v = this.value;
    if (t) { clearTimeout(t); }
    t = setTimeout(function () { M.query = v; memRenderList(); }, 120);
  });
  function opt() {
    M.level = clampInt($('mem-level').value, 1, 31, 1);
    M.tl = clampInt($('mem-tl').value, 1, 31, 1);
    M.tm = clampInt($('mem-tm').value, 0, 65535, 0);
    memRenderRecord();
  }
  $('mem-level').addEventListener('input', opt);
  $('mem-tl').addEventListener('input', opt);
  $('mem-tm').addEventListener('input', opt);
  ['mem-deco1', 'mem-deco2', 'mem-deco3'].forEach(function (id, i) {
    $(id).addEventListener('change', function () {
      M.decos[i] = parseInt(this.value, 10) || 0;
      memRenderRecord();
    });
  });
  function talOpt() {
    M.tal.kind = clampInt($('mem-kind').value, 1, 10, 10);
    M.tal.skill1 = clampInt($('mem-skill1').value, 0, 255, 0);
    M.tal.skill2 = clampInt($('mem-skill2').value, 0, 255, 0);
    M.tal.p1 = clampInt($('mem-p1').value, -128, 127, 0);
    M.tal.p2 = clampInt($('mem-p2').value, -128, 127, 0);
    M.tal.slots = clampInt($('mem-slots').value, 0, 3, 0);
    memRenderRecord();
  }
  ['mem-kind', 'mem-skill1', 'mem-skill2', 'mem-p1', 'mem-p2', 'mem-slots'].forEach(function (id) {
    $(id).addEventListener('change', talOpt);
    $(id).addEventListener('input', talOpt);
  });
  var mbs = document.querySelectorAll('#mode-switch button');
  for (var i = 0; i < mbs.length; i++) {
    (function (b) {
      b.addEventListener('click', function () { setMode(b.getAttribute('data-mode')); });
    })(mbs[i]);
  }
}

/* ============================================================ go */

/* ページ遷移中などに残った Promise の失敗で真っ白にならないようにする */
window.addEventListener('unhandledrejection', function (ev) {
  try { if (window.console && console.warn) { console.warn('[mhxx] unhandled rejection:', ev.reason); } } catch (e) { /* noop */ }
  if (ev.preventDefault) { ev.preventDefault(); }
});

function safeBoot() {
  try {
    boot();
  } catch (err) {
    try {
      showFatal('初期化に失敗しました',
        '<p>' + esc(err && err.message ? err.message : String(err)) + '</p>' +
        '<p>ページを再読み込みしても直らない場合は、単一ファイル版をお試しください。</p>');
    } catch (e2) { /* noop */ }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', safeBoot);
} else {
  safeBoot();
}
})();
</script>
